        /* -------------------------------------------------------------
           APP STATE MANAGEMENT
        ------------------------------------------------------------- */
        let currentLesson = 1;
        let activeQueue = [];
        let currentIndex = 0;
        let currentSpeed = 1.0;
        let isSpeaking = false;
        let historyData = {
            mastered: [], // items marked as mastered
            review: []    // items marked review later
        };

        // Initialize App
        window.onload = function() {
            loadLesson(1);
        };

        /* -------------------------------------------------------------
           LESSON & QUEUE MANAGEMENT
        ------------------------------------------------------------- */
        function loadLesson(lessonKey) {
            currentLesson = lessonKey;
            activeQueue = [];

            if (lessonKey === 'random') {
                document.getElementById('currentLessonTitle').innerText = "🔀 Random Mode (Tất cả Lessons)";
                // Gather all questions from all lessons
                let allQ = [];
                for (let l in QUESTION_BANK) {
                    allQ = allQ.concat(QUESTION_BANK[l].questions);
                }
                // Shuffle array
                activeQueue = [...allQ].sort(() => Math.random() - 0.5);
            } else {
                let lNum = parseInt(lessonKey);
                document.getElementById('currentLessonTitle').innerText = QUESTION_BANK[lNum].title;
                activeQueue = [...QUESTION_BANK[lNum].questions];
            }

            currentIndex = 0;
            renderCurrentQuestion();
        }

        function changeLesson(val) {
            loadLesson(val);
        }

        function renderCurrentQuestion() {
            if (activeQueue.length === 0) {
                alert("Chúc mừng! Bạn đã hoàn thành tất cả câu hỏi trong bài này!");
                return;
            }

            if (currentIndex >= activeQueue.length) {
                currentIndex = 0; // Loop back
            }

            const currentQ = activeQueue[currentIndex];

            // Render numbers
            document.getElementById('currentNumberDisplay').innerText = (currentIndex + 1);
            document.getElementById('totalQuestionsDisplay').innerText = activeQueue.length;

            // Reset UI components
            hideHint();
            resetFeedbackBox();
            document.getElementById('userAnswerInput').value = '';

            // Auto Speak question when loaded
            speakCurrentQuestion();
        }

        /* -------------------------------------------------------------
           SPACED REPETITION LOGIC (ÔN LẠI SAU / ĐÃ NHỚ)
        ------------------------------------------------------------- */
        function markReviewLater() {
            if (activeQueue.length === 0) return;
            const item = activeQueue[currentIndex];

            // Add to history tracking
            if (!historyData.review.find(i => i.id === item.id)) {
                historyData.review.push(item);
            }

            // Insert current item 2-3 steps ahead in current queue
            const insertIdx = Math.min(currentIndex + 3, activeQueue.length);
            activeQueue.splice(insertIdx, 0, item);
            
            // Advance index
            currentIndex++;
            updateHistoryUI();
            renderCurrentQuestion();
        }

        function markMastered() {
            if (activeQueue.length === 0) return;
            const item = activeQueue[currentIndex];

            // Add to history tracking
            if (!historyData.mastered.find(i => i.id === item.id)) {
                historyData.mastered.push(item);
            }
            // Remove from review list if previously added
            historyData.review = historyData.review.filter(i => i.id !== item.id);

            // Remove from active queue so it won't repeat
            activeQueue.splice(currentIndex, 1);

            updateHistoryUI();
            renderCurrentQuestion();
        }

           AUDIO TTS SYSTEM (American English Male Voice)
        ------------------------------------------------------------- */
        function setSpeed(rate) {
            currentSpeed = rate;
            // Highlight speed button
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('bg-sky-500', 'text-white');
                btn.classList.add('text-slate-400');
            });

            if (rate === 1.0) document.getElementById('speed10').className = "speed-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-sky-500 text-white";
            if (rate === 0.75) document.getElementById('speed075').className = "speed-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-sky-500 text-white";
            if (rate === 0.5) document.getElementById('speed05').className = "speed-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-sky-500 text-white";
            if (rate === 0.25) document.getElementById('speed025').className = "speed-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-sky-500 text-white";

            // If audio is playing, replay at new rate
            speakCurrentQuestion();
        }

        async function speakCurrentQuestion() {
            if (activeQueue.length === 0) return;
            const textToSpeak = activeQueue[currentIndex].q;
            const playIcon = document.getElementById('playIcon');

            // iOS Safari: start speech synchronously from the tap handler.
            // Waiting for a network request first can lose the user-gesture
            // permission required by iPhone Safari to play audio.
            const isAppleMobile = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            if (isAppleMobile) {
                playIcon.className = "fa-solid fa-volume-high";
                playWebSpeechTTS(textToSpeak, currentSpeed);
                return;
            }

            playIcon.className = "fa-solid fa-spinner fa-spin";
            try {
                // Keep Gemini TTS as the preferred voice on desktop.
                const success = await playGeminiTTS(textToSpeak, currentSpeed);
                if (!success) playWebSpeechTTS(textToSpeak, currentSpeed);
            } catch (err) {
                playWebSpeechTTS(textToSpeak, currentSpeed);
            } finally {
                playIcon.className = "fa-solid fa-volume-high";
            }
        }

        // Gemini API TTS Call Implementation
        async function playGeminiTTS(text, speed) {
            const apiKey = ""; // Built-in runtime key
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{
                    parts: [{ text: `Speak in a clear, natural American male voice: ${text}` }]
                }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { voiceName: "Puck" } // Natural Male Voice: Puck / Orus / Charon
                        }
                    }
                }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) return false;

                const result = await response.json();
                const candidatePart = result?.candidates?.[0]?.content?.parts?.[0];
                const audioData = candidatePart?.inlineData?.data;
                const mimeType = candidatePart?.inlineData?.mimeType;

                if (audioData && mimeType && mimeType.startsWith("audio/")) {
                    const sampleRateMatch = mimeType.match(/rate=(\d+)/);
                    const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;

                    const rawBytes = atob(audioData);
                    const pcm16 = new Int16Array(rawBytes.length / 2);
                    for (let i = 0; i < pcm16.length; i++) {
                        pcm16[i] = rawBytes.charCodeAt(i * 2) | (rawBytes.charCodeAt(i * 2 + 1) << 8);
                    }

                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);
                    const audio = new Audio(audioUrl);
                    audio.playbackRate = speed;
                    await audio.play();
                    return true;
                }
            } catch (e) {
                console.warn("Gemini TTS fallback triggered", e);
            }
            return false;
        }

        // Web Speech API Fallback
        function playWebSpeechTTS(text, speed) {
            if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
                console.warn('Trình duyệt này không hỗ trợ Web Speech API.');
                return;
            }

            const synth = window.speechSynthesis;
            synth.cancel(); // Stop active speech before starting the new question.

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = speed;
            utterance.lang = 'en-US';

            // On iPhone, getVoices() can initially return an empty list.
            // Speech can still run with the system's default English voice.
            const voices = synth.getVoices();
            const preferredVoice =
                voices.find(v => v.lang.toLowerCase() === 'en-us' &&
                    /male|david|mark|george/i.test(v.name)) ||
                voices.find(v => v.lang.toLowerCase() === 'en-us');

            if (preferredVoice) utterance.voice = preferredVoice;

            utterance.onstart = () => {
                const icon = document.getElementById('playIcon');
                if (icon) icon.className = "fa-solid fa-volume-high";
            };
            utterance.onerror = (event) => {
                console.warn('Web Speech playback error:', event.error);
                const icon = document.getElementById('playIcon');
                if (icon) icon.className = "fa-solid fa-volume-high";
            };

            // resume() helps recover if iOS Safari has left speech synthesis paused.
            synth.resume();
            synth.speak(utterance);
        }

        // Convert PCM Int16 Array to WAV Blob
        function pcmToWav(pcm16, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcm16.length * 2);
            const view = new DataView(buffer);

            function writeString(offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + pcm16.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // Raw PCM
            view.setUint16(22, 1, true); // Mono channel
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcm16.length * 2, true);

            for (let i = 0; i < pcm16.length; i++) {
                view.setInt16(44 + i * 2, pcm16[i], true);
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }

        /* -------------------------------------------------------------
           AI EVALUATION SYSTEM (GEMINI 3 FLASH)
        ------------------------------------------------------------- */
        async function submitAnswer() {
            const userAns = document.getElementById('userAnswerInput').value.trim();
            if (!userAns) {
                alert("Vui lòng nhập câu trả lời trước khi nộp!");
                return;
            }

            const currentQ = activeQueue[currentIndex];
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Checking...</span>`;

            const feedbackBox = document.getElementById('feedbackResultBox');
            feedbackBox.className = "rounded-xl p-4 border border-sky-500/40 bg-slate-900/90 text-slate-300 block";
            document.getElementById('feedbackHeader').innerHTML = `<span class="text-sky-400 font-bold"><i class="fa-solid fa-robot mr-2"></i>AI đang chấm điểm câu trả lời...</span>`;
            document.getElementById('feedbackBody').innerHTML = `<p class="text-xs text-slate-400">Đang kiểm tra ngữ pháp Level A1 và tính chính xác...</p>`;

            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const systemPrompt = `You are a friendly English teacher checking an adult student's A1-level answer.
Question asked: "${currentQ.q}"
Target Sample Answer: "${currentQ.answer}"

Rule Guidelines:
1. Student language MUST ONLY use basic Level A1 vocabulary and standard grammar (Present Simple, or Present Continuous if keywords like 'now', 'today' are present).
2. If the user's answer has grammar or prepositions wrong (e.g. "My birthday is January" instead of "My birthday is on June 3rd"), mark it as incorrect.
3. Respond ONLY in valid JSON format:
{
  "isCorrect": boolean,
  "headline": string,
  "errorDetails": string,
  "suggestedCorrection": string,
  "explanationVN": string
}

Guidelines for fields:
- "isCorrect": true if grammatically valid and answers the question at A1 level, false otherwise.
- "headline": If correct: "Chính xác! 🎉" (green text). If incorrect: "Câu trả lời chưa chính xác" (red text).
- "errorDetails": In Vietnamese, clearly point out what specific part is wrong or missing.
- "suggestedCorrection": Provide the exact corrected sentence using simple A1 level English.
- "explanationVN": Explain WHY it is wrong in simple, encouraging Vietnamese.`;

            const payload = {
                contents: [{ parts: [{ text: `Student answer: "${userAns}"` }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json"
                }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                const jsonText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (jsonText) {
                    const result = JSON.parse(jsonText);
                    renderAIFeedback(result, userAns);
                } else {
                    renderAIFeedbackFallback(userAns, currentQ);
                }
            } catch (err) {
                console.error(err);
                renderAIFeedbackFallback(userAns, currentQ);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Submit</span> <i class="fa-solid fa-paper-plane"></i>`;
            }
        }

        function renderAIFeedback(res, userAns) {
            const feedbackBox = document.getElementById('feedbackResultBox');
            const header = document.getElementById('feedbackHeader');
            const body = document.getElementById('feedbackBody');

            if (res.isCorrect) {
                feedbackBox.className = "rounded-xl p-4 border border-emerald-500/50 bg-emerald-950/40 text-slate-200 block";
                header.innerHTML = `<span class="text-emerald-400 font-bold text-lg"><i class="fa-solid fa-circle-check mr-2"></i>${res.headline || 'Chính xác! 🎉'}</span>`;
                body.innerHTML = `
                    <p class="text-sm font-semibold text-emerald-300">Câu trả lời: "${userAns}"</p>
                    <p class="text-xs text-slate-300 mt-1">${res.explanationVN || 'Bạn đã sử dụng đúng từ vựng và ngữ pháp Level A1.'}</p>
                `;
            } else {
                feedbackBox.className = "rounded-xl p-4 border border-rose-500/60 bg-rose-950/40 text-slate-200 block";
                header.innerHTML = `<span class="text-rose-400 font-bold text-lg"><i class="fa-solid fa-triangle-exclamation mr-2"></i>${res.headline || 'Câu trả lời chưa chính xác'}</span>`;
                body.innerHTML = `
                    <div class="space-y-1.5 mt-1 text-sm">
                        <p class="text-rose-300 font-medium"><strong class="text-white">Lỗi phát hiện:</strong> ${res.errorDetails || 'Ngữ pháp hoặc từ vựng chưa đúng cấu trúc A1.'}</p>
                        <p class="text-emerald-300 font-semibold"><strong class="text-white">Gợi ý sửa lại đúng:</strong> "${res.suggestedCorrection || activeQueue[currentIndex].answer}"</p>
                        <p class="text-xs text-slate-300 pt-1 border-t border-rose-900/50"><strong class="text-slate-200">Giải thích chi tiết:</strong> ${res.explanationVN || 'Hãy chú ý thì Hiện tại đơn và các giới từ cơ bản.'}</p>
                    </div>
                `;
            }
        }

        function renderAIFeedbackFallback(userAns, currentQ) {
            const feedbackBox = document.getElementById('feedbackResultBox');
            feedbackBox.className = "rounded-xl p-4 border border-amber-500/50 bg-amber-950/40 text-slate-200 block";
            document.getElementById('feedbackHeader').innerHTML = `<span class="text-amber-400 font-bold"><i class="fa-solid fa-circle-info mr-2"></i>Đã ghi nhận câu trả lời!</span>`;
            document.getElementById('feedbackBody').innerHTML = `
                <p class="text-sm font-medium text-slate-200">Câu trả lời của bạn: "${userAns}"</p>
                <p class="text-xs text-emerald-300 mt-1 font-semibold">Đáp án mẫu chuẩn A1: "${currentQ.answer}"</p>
            `;
        }

        function resetFeedbackBox() {
            const feedbackBox = document.getElementById('feedbackResultBox');
            feedbackBox.classList.add('hidden');
        }

        /* -------------------------------------------------------------
           HISTORY MODAL UI & FILTERS
        ------------------------------------------------------------- */
        function toggleHistoryModal() {
            const modal = document.getElementById('historyModal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                filterHistory('all');
            } else {
                modal.classList.add('hidden');
            }
        }

        function updateHistoryUI() {
            const masteredCount = historyData.mastered.length;
            const reviewCount = historyData.review.length;
            const total = masteredCount + reviewCount;

            document.getElementById('historyBadge').innerText = total;
            document.getElementById('countAll').innerText = total;
            document.getElementById('countMastered').innerText = masteredCount;
            document.getElementById('countReview').innerText = reviewCount;
        }

        function filterHistory(type) {
            const container = document.getElementById('historyListContainer');
            container.innerHTML = '';

            // Update tab styles
            document.getElementById('tabAll').className = type === 'all' ? "px-3 py-1.5 text-xs font-bold rounded-lg bg-sky-500 text-white" : "px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-700 text-slate-300";
            document.getElementById('tabMastered').className = type === 'mastered' ? "px-3 py-1.5 text-xs font-bold rounded-lg bg-emerald-500 text-white" : "px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-700 text-emerald-400";
            document.getElementById('tabReview').className = type === 'review' ? "px-3 py-1.5 text-xs font-bold rounded-lg bg-amber-500 text-white" : "px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-700 text-amber-400";

            let itemsToDisplay = [];
            if (type === 'mastered') itemsToDisplay = historyData.mastered.map(i => ({...i, status: 'mastered'}));
            else if (type === 'review') itemsToDisplay = historyData.review.map(i => ({...i, status: 'review'}));
            else {
                itemsToDisplay = [
                    ...historyData.mastered.map(i => ({...i, status: 'mastered'})),
                    ...historyData.review.map(i => ({...i, status: 'review'}))
                ];
            }

            if (itemsToDisplay.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">Chưa có dữ liệu học tập trong mục này.</div>`;
                return;
            }

            itemsToDisplay.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = "bg-slate-900 border border-slate-700 rounded-xl p-3.5 flex items-start justify-between gap-3";
                
                const isMastered = item.status === 'mastered';
                const statusBadge = isMastered 
                    ? `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-2 py-0.5 rounded-md font-bold">Đã Nhớ</span>`
                    : `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs px-2 py-0.5 rounded-md font-bold">Ôn Lại Sau</span>`;

                itemDiv.innerHTML = `
                    <div class="space-y-1">
                        <p class="text-sm font-semibold text-white">${item.q}</p>
                        <p class="text-xs text-emerald-400 font-medium">${item.answer}</p>
                    </div>
                    <div>${statusBadge}</div>
                `;
                container.appendChild(itemDiv);
            });
        }
    </script>
